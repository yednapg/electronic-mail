name: Build notarized macOS release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Public version (for example 1.0.0)
        required: true
        type: string
      build_number:
        description: Monotonically increasing integer build number
        required: true
        type: string
      backend_url:
        description: Production HTTPS API origin, without a path
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: macos-production-release
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: macos-15-intel
    timeout-minutes: 45
    env:
      VERSION: ${{ inputs.version }}
      BUILD_NUMBER: ${{ inputs.build_number }}
      BACKEND_URL: ${{ inputs.backend_url }}
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      EXPECTED_XCODE_VERSION: "16.4"
      EXPECTED_XCODE_BUILD: 16F6
    steps:
      - name: Require the reviewed main branch
        run: test "$GITHUB_REF" = refs/heads/main

      - name: Require successful exact-commit quality gates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          successful_runs="$(
            gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow quality.yml \
              --branch main \
              --commit "$GITHUB_SHA" \
              --event push \
              --limit 20 \
              --json conclusion,headBranch,headSha,status \
              --jq '[.[] | select(.headBranch == "main" and .headSha == env.GITHUB_SHA and .status == "completed" and .conclusion == "success")] | length'
          )"
          if [ "$successful_runs" -lt 1 ]; then
            echo "No successful Quality and release gates run exists for exact commit $GITHUB_SHA." >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.22.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.10"

      - name: Verify approved Xcode 16.4 (16F6)
        run: bash scripts/verify-macos-toolchain.sh

      - name: Validate production release inputs
        run: npm run release:macos:validate

      - name: Run native tests
        run: npm run macos:test

      - name: Run credential-free universal Release preflight
        run: npm run release:macos:preflight

  release:
    needs: preflight
    runs-on: macos-15-intel
    environment: production-macos
    timeout-minutes: 90
    env:
      VERSION: ${{ inputs.version }}
      BUILD_NUMBER: ${{ inputs.build_number }}
      BACKEND_URL: ${{ inputs.backend_url }}
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      EXPECTED_XCODE_VERSION: "16.4"
      EXPECTED_XCODE_BUILD: 16F6
      APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
      DEVELOPER_ID_APPLICATION: ${{ secrets.DEVELOPER_ID_APPLICATION }}
      NOTARY_PROFILE: electronic-mail-ci-notary
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.22.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.10"

      - name: Verify approved Xcode 16.4 (16F6)
        run: bash scripts/verify-macos-toolchain.sh

      - name: Import Developer ID certificate
        env:
          P12_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
        run: |
          set -euo pipefail
          : "${P12_BASE64:?MACOS_DEVELOPER_ID_P12_BASE64 is required}"
          : "${P12_PASSWORD:?MACOS_DEVELOPER_ID_P12_PASSWORD is required}"
          : "${APPLE_DEVELOPMENT_TEAM:?APPLE_DEVELOPMENT_TEAM is required}"
          : "${DEVELOPER_ID_APPLICATION:?DEVELOPER_ID_APPLICATION is required}"
          keychain_path="$RUNNER_TEMP/electronic-mail-release.keychain-db"
          certificate_path="$RUNNER_TEMP/developer-id-application.p12"
          keychain_password="$(openssl rand -hex 24)"
          printf '%s' "$P12_BASE64" | /usr/bin/base64 --decode > "$certificate_path"
          chmod 600 "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -k "$keychain_path" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security default-keychain -d user -s "$keychain_path"
          security find-identity -v -p codesigning "$keychain_path" | grep -F "\"$DEVELOPER_ID_APPLICATION\""
          rm -f "$certificate_path"

      - name: Store temporary notarization credentials
        env:
          NOTARY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          NOTARY_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          : "${NOTARY_KEY_ID:?APP_STORE_CONNECT_KEY_ID is required}"
          : "${NOTARY_ISSUER_ID:?APP_STORE_CONNECT_ISSUER_ID is required}"
          : "${NOTARY_PRIVATE_KEY_BASE64:?APP_STORE_CONNECT_PRIVATE_KEY_BASE64 is required}"
          key_path="$RUNNER_TEMP/AuthKey_${NOTARY_KEY_ID}.p8"
          printf '%s' "$NOTARY_PRIVATE_KEY_BASE64" | /usr/bin/base64 --decode > "$key_path"
          chmod 600 "$key_path"
          xcrun notarytool store-credentials "$NOTARY_PROFILE" \
            --key "$key_path" \
            --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER_ID"
          rm -f "$key_path"

      - name: Build, sign, notarize, staple, and verify
        env:
          OUTPUT_DIR: ${{ runner.temp }}/electronic-mail-release
          WORK_DIR: ${{ runner.temp }}/electronic-mail-release-work
        run: npm run release:macos

      - name: Upload private release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ElectronicMail-${{ inputs.version }}-${{ inputs.build_number }}
          path: ${{ runner.temp }}/electronic-mail-release/
          if-no-files-found: error
          retention-days: 90

      - name: Remove temporary signing keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/electronic-mail-release.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP"/*.p8 "$RUNNER_TEMP"/*.p12
