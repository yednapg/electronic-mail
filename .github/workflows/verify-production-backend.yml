name: Production backend exact-release gate

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full immutable backend commit SHA to verify
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-backend-${{ github.event_name == 'workflow_dispatch' && inputs.release_sha || github.event.deployment.sha }}
  cancel-in-progress: true

jobs:
  exact-release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
      github.event.deployment.environment == 'production')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BACKEND_URL: ${{ secrets.PRODUCTION_BACKEND_URL }}
      OPS_BEARER_TOKEN: ${{ secrets.PRODUCTION_OPS_BEARER_TOKEN }}
      EXPECTED_RELEASE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.release_sha || github.event.deployment.sha }}
      MAX_QUEUE_DEPTH_PER_QUEUE: "1000"
      MAX_TOTAL_QUEUE_DEPTH: "2500"
      MAX_OLDEST_QUEUED_AGE_SECONDS: "900"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Never execute verifier code from the just-deployed revision while
          # the production ops bearer is present. Deployment events use the
          # trusted default-branch verifier to inspect the deployed SHA.
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"
      - name: Require the exact API and every worker role to converge
        run: >-
          python3 scripts/verify_backend_release.py
          --timeout-seconds 600
          --poll-seconds 10
          --stable-successes 3
