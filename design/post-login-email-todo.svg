<svg width="1728" height="1117" viewBox="0 0 1728 1117" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>Turning your emails into a to-do list</title>
  <desc>Post-login transition screen for an email app that turns emails into a to-do list.</desc>
  <defs>
    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.10"/>
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="trayFace" x1="737" y1="292" x2="991" y2="407" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#ECECEC"/>
    </linearGradient>
    <linearGradient id="trayLip" x1="758" y1="331" x2="970" y2="398" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F9F9F9"/>
      <stop offset="1" stop-color="#DCDCDC"/>
    </linearGradient>
    <style>
      .ui-font {
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", Inter, Helvetica, Arial, sans-serif;
      }
      .headline {
        font-size: 58px;
        font-weight: 650;
        letter-spacing: -1px;
        fill: #050505;
      }
      .body {
        font-size: 30px;
        font-weight: 390;
        letter-spacing: 0;
        fill: #282828;
      }
      .category {
        font-size: 28px;
        font-weight: 430;
        letter-spacing: 0;
        fill: #111111;
      }
      .status {
        font-size: 26px;
        font-weight: 410;
        letter-spacing: 0;
        fill: #565656;
      }
      .small {
        font-size: 22px;
        font-weight: 420;
        letter-spacing: 0;
        fill: #747474;
      }
    </style>
  </defs>

  <rect width="1728" height="1117" rx="32" fill="#FCFCFB"/>

  <!-- app icon: neutral tray with red / blue / green task cards -->
  <g filter="url(#softShadow)" transform="translate(0 4)">
    <rect x="784" y="252" width="64" height="106" rx="10" transform="rotate(-11 784 252)" fill="#E94F4F"/>
    <rect x="832" y="232" width="64" height="126" rx="10" fill="#2F80ED"/>
    <rect x="892" y="251" width="64" height="106" rx="10" transform="rotate(10 892 251)" fill="#25A65A"/>

    <rect x="803" y="277" width="40" height="5" rx="2.5" fill="white" fill-opacity="0.72"/>
    <rect x="849" y="264" width="33" height="5" rx="2.5" fill="white" fill-opacity="0.72"/>
    <rect x="909" y="279" width="37" height="5" rx="2.5" fill="white" fill-opacity="0.72"/>

    <path d="M743 333C743 320.85 752.85 311 765 311H963C975.15 311 985 320.85 985 333V408C985 420.15 975.15 430 963 430H765C752.85 430 743 420.15 743 408V333Z" fill="url(#trayFace)"/>
    <path d="M754 339C754 331.82 759.82 326 767 326H961C968.18 326 974 331.82 974 339V371C974 371 935.8 400 864 400C792.2 400 754 371 754 371V339Z" fill="url(#trayLip)"/>
    <path d="M743 335C743 321.75 753.75 311 767 311H961C974.25 311 985 321.75 985 335V408C985 421.25 974.25 432 961 432H767C753.75 432 743 421.25 743 408V335Z" stroke="#D7D7D7" stroke-width="2"/>
    <path d="M756 371C781.333 392.333 817.333 403 864 403C910.667 403 946.667 392.333 972 371" stroke="#C9C9C9" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- headline -->
  <text class="ui-font headline" text-anchor="middle" x="864" y="520">Turning your emails</text>
  <text class="ui-font headline" text-anchor="middle" x="864" y="589">into a to-do list</text>

  <!-- body -->
  <text class="ui-font body" text-anchor="middle" x="864" y="659">We’re finding bills, orders, invites, forms,</text>
  <text class="ui-font body" text-anchor="middle" x="864" y="700">refunds, and work items.</text>

  <!-- category list -->
  <g transform="translate(683 766)">
    <g>
      <circle cx="12" cy="12" r="8" fill="#2F80ED"/>
      <path d="M7.5 12.2L10.6 15.4L16.8 8.8" stroke="white" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
      <text class="ui-font category" x="42" y="22">bills and due dates</text>
    </g>
    <g transform="translate(0 52)">
      <circle cx="12" cy="12" r="8" fill="#25A65A"/>
      <path d="M7.5 12.2L10.6 15.4L16.8 8.8" stroke="white" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
      <text class="ui-font category" x="42" y="22">orders and refunds</text>
    </g>
    <g transform="translate(0 104)">
      <circle cx="12" cy="12" r="8" fill="#E94F4F"/>
      <path d="M7.5 12.2L10.6 15.4L16.8 8.8" stroke="white" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
      <text class="ui-font category" x="42" y="22">invites and forms</text>
    </g>
    <g transform="translate(0 156)">
      <circle cx="12" cy="12" r="8" fill="#2F80ED" fill-opacity="0.18"/>
      <circle cx="12" cy="12" r="4" fill="#2F80ED"/>
      <text class="ui-font category" x="42" y="22">work items</text>
      <text class="ui-font small" x="177" y="22">almost done</text>
    </g>
  </g>

  <!-- final status line -->
  <g transform="translate(0 1002)">
    <text class="ui-font status" text-anchor="middle" x="864" y="0">Your to-do list is almost ready.</text>
    <g transform="translate(1074 -27)">
      <rect x="0" y="0" width="33" height="24" rx="6" fill="#F2F2F2" stroke="#D9D9D9" stroke-width="1.5"/>
      <rect x="6" y="-8" width="21" height="18" rx="4" fill="#2F80ED"/>
      <path d="M10 -1L15 4L25 -7" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
